<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ProActive Store - Fashion for Egypt. Fresh styles, honest prices, delivered to your door." />
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ProActive Store" />
  
  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="ProActive Store - Fashion" />
  <meta property="og:description" content="Fresh styles, honest prices, delivered to your door." />
  <meta property="og:type" content="website" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <!-- Fonts are self-hosted (npm @fontsource/*, imported in src/main.jsx):
       no external request on first load and no third-party dependency on
       Egyptian networks. Do not re-add the Google Fonts links. -->

  <!-- Leaflet: the SPA imports the bundled leaflet package; this CDN copy is
       a legacy leftover for pages that predate it. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <title>ProActive Store</title>
   <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  <!-- Global styles live in src/tokens.css + src/index.css -->

  <!-- Loading state for better perceived performance -->
  <script>
    // Prevent FOUC (Flash of Unstyled Content)
    document.documentElement.style.opacity = '1';
    
    // Check if JavaScript is enabled
    if (!window.globalThis) {
      window.globalThis = window;
    }

    // Detect if app is running on mobile for analytics (optional)
    window.isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  </script>
</head>
<body>
  <!-- No-JavaScript fallback -->
  <noscript>
    <div style="
      padding: 20px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      margin: 20px;
      font-family: sans-serif;
    ">
      <h2 style="margin-top: 0;">JavaScript Required</h2>
      <p>This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings to continue.</p>
    </div>
  </noscript>

  <!-- Root element for React -->
  <div id="root"></div>

  <!-- Main app script -->
  <script type="module" src="/src/main.jsx"></script>

</body>
</html>
